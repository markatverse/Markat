services:
  - type: web
    name: markatverse-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://markat-test.vercel.app,http://localhost:3000"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Markatverse <support@markatverse.com>"
      - key: VAPID_PUBLIC_KEY
        value: "BN_jaDBXw1sklVycMQY15TtlQfDhndk9v0PO-eqJdm8fZSPwzN1ZKU8b8QD51_SuRFTFvPIrNLD68YK-cSaUGfA"
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:support@markatverse.com"
